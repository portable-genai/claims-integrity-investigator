# Claims Integrity Investigator (Ins1) runtime configuration.
#
# Loaded by `src/claims_integrity_investigator/config.py`. Point at a different file with
# CLAIMSINTEG_SETTINGS; a path that is named but missing is a boot error, not
# a silent fall-back to built-in defaults.
#
# `${VAR}` and `${VAR:-default}` resolve in THREE states: unset takes the default written here,
# SET-AND-EMPTY REFUSES at boot (an operator who emptied a value expressed an intent, and it
# names nothing, so it must not inherit the default and must not silently become the empty
# string either), and a set value wins. To take the default written here, UNSET the variable.
# This file holds env var NAMES and non-secret defaults only: no secret value is ever committed
# here.

# Data residency. Selected once and shared by the runtime and Terraform.
region: ${GCP_REGION:-asia-southeast1}

# Tenant partition asserted on outbound reviews when the verified principal carries none.
# (Built as one template expression: a literal "${" immediately before a template opener is
# ambiguous to render, so the whole reference is produced by the expression instead.)
tenant: ${CLAIMSINTEG_TENANT:-}

# Local profile stores. ":memory:" is the ephemeral, deterministic default the gate uses; a
# deployment points this at a durable path.
audit_path: ${CLAIMSINTEG_AUDIT_PATH:-:memory:}

# The external head anchor for the WORM audit chain (practices check C9). The hash chain cannot
# detect a TRUNCATED TAIL by itself: dropping the newest rows leaves a shorter chain that
# verifies perfectly. Point this at a file on a DIFFERENT volume, under different credentials,
# from audit_path, and every append also writes the chain head there. Empty (the default) means
# no anchor, which is correct for the ephemeral ":memory:" store and wrong for a durable one.
audit_anchor_path: ${CLAIMSINTEG_AUDIT_ANCHOR:-}

# The audience the managed (gcp) IAP identity adapter verifies the assertion AGAINST: the
# IAP-protected resource, "/projects/<NUM>/global/backendServices/<ID>" behind an HTTPS load
# balancer. It is per-deployment, so it is configuration and never a literal in the adapter.
# Three states, and UNSET and SET-AND-EMPTY land in the same place on purpose: both resolve to
# empty, and an empty audience REFUSES every caller rather than verifying without one.
# google-auth documents audience=None as "the audience is not verified", which accepts ANY
# Google-signed OIDC token, from any project or any app, and reads its email as a principal.
iap_audience: ${CLAIMSINTEG_IAP_AUDIENCE:-}

# Rule R8: where an escalated result is routed for human review. The managed profile REFUSES to
# swallow an escalation when this is empty, so a producer cannot ship with R8 unwired.
# The outbound S2S credentials are HRZ7_S2S_TOKEN / HRZ7_S2S_SIGNING_KEY (see .env.secrets.example),
# deliberately distinct from this service's own inbound CLAIMSINTEG_S2S_TOKEN.
review_url: ${HRZ_HUMAN_REVIEW_URL:-}

# The Hrz2 governed-RAG service the managed policy-corpus adapter retrieves policy wording from.
# Hrz2 is a HARD row dependency: an unset/empty endpoint makes the governed-retrieval adapter
# REFUSE rather than fall back to an ungoverned file search. Empty is correct offline (the local
# fixture corpus stands in) and wrong for a managed deployment, which must name the Hrz2 URL.
hrz2_endpoint: ${CLAIMSINTEG_HRZ2_URL:-}

# The adopter-owned assessment policy: the fraud-indicator uplifts, the fraud-score bands and the
# late-notification / velocity / round-amount thresholds. These are the CLIENT's numbers, so they
# live here as data (frozen into `domain.policy.AssessmentPolicy`) rather than as constants in an
# engine. An absent block takes the shipped fictional defaults; a present block overrides only the
# keys it names. `as_of` stamps every assessment with the policy version that produced it.
policy:
  as_of: "2026-01-01"
  late_notification_days: 30
  velocity_window_days: 365
  velocity_threshold: 3
  round_amount_floor_cents: 50000
  round_amount_unit_cents: 100000
  fraud_baseline: 0.05
  max_uplift: 0.80
  siu_refer_score: 0.55
  investigate_score: 0.30
  uplifts:
    late_notification: 0.10
    staged_loss: 0.25
    invoice_anomaly: 0.15
    claims_velocity: 0.20
    organised_fraud_link: 0.40
  staged_loss_markers:
    - "no forced entry"
    - "receipts dated after loss"
    - "prior identical claim"
    - "vehicle already damaged"
    - "witness unreachable"

# The per-port adapter map: the ONLY place a binding lives, so switching the whole stack is a
# configuration change rather than a code edit. Every port must bind every profile; the loader
# refuses a partial block and `tests/test_settings_file.py` fails the build if this drifts from
# `config.DEFAULT_BINDINGS`.
project_id: ${GOOGLE_CLOUD_PROJECT:-}

adapters:
  audit:
    local: claims_integrity_investigator.adapters.local.audit:LocalAuditAdapter
    gcp: claims_integrity_investigator.adapters.gcp.audit:CloudAuditAdapter
    onprem: claims_integrity_investigator.adapters.onprem.audit:OnPremAuditAdapter
  claim_file:
    local: claims_integrity_investigator.adapters.local.claim_file:LocalClaimFileAdapter
    gcp: claims_integrity_investigator.adapters.gcp.claim_file:CloudClaimFileAdapter
    onprem: claims_integrity_investigator.adapters.onprem.claim_file:OnPremClaimFileAdapter
  claims_history:
    local: claims_integrity_investigator.adapters.local.claims_history:LocalClaimsHistoryAdapter
    gcp: claims_integrity_investigator.adapters.gcp.claims_history:CloudClaimsHistoryAdapter
    onprem: claims_integrity_investigator.adapters.onprem.claims_history:OnPremClaimsHistoryAdapter
  extraction:
    local: claims_integrity_investigator.adapters.local.extraction:LocalExtractionAdapter
    gcp: claims_integrity_investigator.adapters.gcp.extraction:CloudExtractionAdapter
    onprem: claims_integrity_investigator.adapters.onprem.extraction:OnPremExtractionAdapter
  fraud_linkage:
    local: claims_integrity_investigator.adapters.local.fraud_linkage:LocalFraudLinkageAdapter
    gcp: claims_integrity_investigator.adapters.gcp.fraud_linkage:CloudFraudLinkageAdapter
    onprem: claims_integrity_investigator.adapters.onprem.fraud_linkage:OnPremFraudLinkageAdapter
  generation:
    local: claims_integrity_investigator.adapters.local.generation:LocalGenerationAdapter
    gcp: claims_integrity_investigator.adapters.gcp.generation:CloudGenerationAdapter
    onprem: claims_integrity_investigator.adapters.onprem.generation:OnPremGenerationAdapter
  identity:
    local: claims_integrity_investigator.adapters.local.identity:LocalIdentityAdapter
    gcp: claims_integrity_investigator.adapters.gcp.identity:IapIdentityAdapter
    onprem: claims_integrity_investigator.adapters.onprem.identity:OnPremIdentityAdapter
  policy_corpus:
    local: claims_integrity_investigator.adapters.local.policy_corpus:LocalPolicyCorpusAdapter
    gcp: claims_integrity_investigator.adapters.gcp.policy_corpus:Hrz2PolicyCorpusAdapter
    onprem: claims_integrity_investigator.adapters.onprem.policy_corpus:OnPremPolicyCorpusAdapter
  review_router:
    local: claims_integrity_investigator.adapters.local.review_router:LocalReviewRouter
    gcp: claims_integrity_investigator.adapters.gcp.review_router:CloudReviewRouter
    onprem: claims_integrity_investigator.adapters.onprem.review_router:OnPremReviewRouter

  # Tracing. Which BACKEND a deployed profile exports to is not a binding: the gcp
  # adapter reads OTEL_EXPORTER_OTLP_ENDPOINT and sends OTLP to the Hrz5 collector when it
  # is set, straight to Cloud Trace when it is not. Tracing is not essential to
  # correctness, so onprem is ABSENT rather than fatal, unlike the other placeholders.
  tracer:
    local: claims_integrity_investigator.adapters.local.tracer:LocalNoopTracerAdapter
    gcp: claims_integrity_investigator.adapters.gcp.tracer:CloudTracerAdapter
    onprem: claims_integrity_investigator.adapters.onprem.tracer:OnPremTracerAdapter

  # The promotion authority (Hrz4). The local adapter scores offline but REFUSES to
  # promote: a promotion certified by a laptop with no quality service is certified by
  # nothing.
  evaluation:
    local: claims_integrity_investigator.adapters.local.evaluation:LocalOfflineEvalAdapter
    gcp: claims_integrity_investigator.adapters.gcp.evaluation:ManagedEvalGateAdapter
    onprem: claims_integrity_investigator.adapters.onprem.evaluation:OnPremEvalAdapter
